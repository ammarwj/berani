# Pasang ke: /etc/nginx/conf.d/berani-http.conf
#
# limit_req_zone dan map hanya sah di konteks http{}, bukan di dalam server{} —
# karena itu terpisah dari vhost. conf.d/ sudah di-include dari http{} oleh
# nginx.conf bawaan Debian/Ubuntu, jadi nginx.conf tidak perlu disentuh.
#
# conf.d/ adalah namespace bersama dengan situs lain di VPS ini (flo-event). Nama
# zone atau variabel map yang bentrok adalah fatal error saat `nginx -t`, bukan
# warning — semua nama di sini diawali berani_ supaya tidak menjatuhkan situs lain.

# Connection: upgrade hanya boleh dikirim saat klien memang meminta upgrade —
# mengirimnya di setiap request akan mematikan keepalive ke upstream. JANGAN beri
# nama $connection_upgrade: itu nama konvensional dan situs lain di conf.d/ hampir
# pasti sudah mendeklarasikannya; map ganda = fatal error.
map $http_upgrade $berani_connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit hanya untuk POST. Kunci kosong = nginx melewatkan request tanpa
# menghitung, jadi GET tetap bebas — penting untuk GET /reports/{ticket}: pelacakan
# tiket tidak butuh login dan dibuka pelapor yang sedang cemas, tidak boleh dicekik.
# OPTIONS juga lolos, kalau tidak preflight CORS akan kena 429 dan semua request
# browser gagal.
map $request_method $berani_post_ip {
    default "";
    POST    $binary_remote_addr;
}

# Angka di sini sengaja lebih longgar dari limiter Go (10/menit, 5/10menit):
# $binary_remote_addr adalah IP publik, dan satu sekolah bisa ber-NAT di belakang
# satu IP — seluruh kelas terlihat sebagai satu klien. Pantau baris
# `limiting requests, zone "berani_auth"` di /var/log/nginx/error.log minggu
# pertama, naikkan kalau siswa yang sah ikut terkena.
limit_req_zone $berani_post_ip zone=berani_auth:10m rate=30r/m;
limit_req_zone $berani_post_ip zone=berani_report:10m rate=10r/m;

# Rem banjir umum, per IP untuk semua metode. Kontrol keamanan sebenarnya ada di
# dua zone di atas; ini hanya menahan scraper dan flood, jadi disetel longgar.
#
# Angka diukur dari aplikasi ini, bukan ditebak: satu cold load halaman = 22
# request ke web (HTML + chunk JS + font), satu sesi penjelajahan = 5 request API.
# Karena kuncinya IP publik, satu sekolah ber-NAT tampil sebagai satu klien — dua
# kelas (60 siswa) membuka app bersamaan = ~1300 request web dan ~300 API dalam
# beberapa detik. Nilai lama (300r/m web) mengunci kelas pertama di tengah jalan.
# burst besar dengan nodelay itu yang menyerap lonjakan serentak; rate hanya
# mengatur laju berkelanjutan.
limit_req_zone $binary_remote_addr zone=berani_api:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=berani_web:10m rate=2000r/m;

# 429, bukan 503 default — ini kondisi klien, dan klien (juga monitoring) perlu
# bisa membedakannya dari server yang tumbang.
limit_req_status 429;
