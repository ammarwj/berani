# Pasang ke: /etc/nginx/sites-available/berani.conf, symlink ke sites-enabled/.
# Butuh conf.d/berani-http.conf (zone rate limit) sudah terpasang lebih dulu.
#
# File ini plain HTTP saja. certbot --nginx akan MENULIS ULANG file ini di tempat:
# menambahkan blok 443 dengan sertifikat dan mengubah blok 80 jadi redirect. Jangan
# salin ulang dari repo setelah certbot jalan tanpa menjalankan certbot lagi —
# sertifikatnya akan hilang dari konfigurasi.

server {
    listen 80;
    listen [::]:80;
    server_name berani.site;

    # Semua proxy_set_header di level server{}, bukan di dalam location{}.
    # Mendeklarasikan SATU saja di dalam location membuang SELURUH yang diwarisi —
    # begitulah Host dan X-Forwarded-Proto hilang diam-diam.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $berani_connection_upgrade;

    # Pembawa ?v=<build id> yang jadi kunci nama cache semua aset lain. Kalau file
    # ini disajikan dari cache, deploy baru tidak akan pernah terlihat.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3004;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # burst besar: satu cold load halaman ini saja sudah 22 request (HTML, chunk,
    # font), dan satu kelas membukanya serentak.
    location / {
        limit_req zone=berani_web burst=600 nodelay;
        proxy_pass http://127.0.0.1:3004;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.berani.site;

    # Cap lampiran di API 10 MB (internal/report/handlers.go:20). nginx menghitung
    # seluruh body termasuk boundary dan header multipart, jadi file 10 MB melewati
    # 10m. Di 12m, API yang menegakkan batas dan pesan errornya sampai ke pengguna;
    # di 10m nginx mengirim 413 HTML tanpa header CORS, yang di browser muncul
    # sebagai error jaringan tanpa penjelasan.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Enam endpoint auth (router.go:52-57). burst kecil: satu halaman login hanya
    # mengirim satu POST.
    location ~ ^/auth/(register|login|refresh|verify-email|forgot-password|reset-password)$ {
        limit_req zone=berani_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8004;
    }

    # Pengiriman laporan dan lampirannya (router.go:79-80). Lampiran diunggah satu
    # per satu setelah laporan dibuat, jadi burst harus memberi ruang untuk beberapa
    # berkas dalam satu sesi.
    location ~ ^/reports(/[^/]+/attachments)?$ {
        limit_req zone=berani_report burst=15 nodelay;
        proxy_pass http://127.0.0.1:8004;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        limit_req zone=berani_api burst=200 nodelay;
        proxy_pass http://127.0.0.1:8004;
    }
}
