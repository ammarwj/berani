# Dipatok eksplisit: default compose diturunkan dari nama direktori, jadi berbeda
# antara klon lokal (berani.id → "beraniid") dan server (/opt/berani → "berani").
# Nama itu jadi prefix nama volume — kalau berubah, `pgdata` menunjuk volume lain
# dan database terlihat kosong.
name: berani

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: berani
      POSTGRES_PASSWORD: berani
      POSTGRES_DB: berani
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berani"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    # R2 + SMTP credentials. Copy api/.env.example to api/.env; without it
    # attachments are disabled and emails are logged instead of sent.
    env_file:
      - ./api/.env
    environment:
      PORT: 8080
      # Overrides the localhost URL in api/.env — inside compose the DB is a service.
      DATABASE_URL: postgres://berani:berani@postgres:5432/berani?sslmode=disable
      # CORS origin: must match where the browser actually loads the web app from.
      APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      # NEXT_PUBLIC_* di-inline saat `next build`, bukan dibaca saat runtime — jadi
      # ini wajib build arg, bukan `environment:`. Ubah API_PORT dan build ulang;
      # menyetelnya di environment tidak akan mengubah bundle.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
        NEXT_PUBLIC_BUILD_ID: ${BUILD_ID:-dev}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
